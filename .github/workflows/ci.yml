# Integração contínua do RotinaTEA (Pilar 2: qualidade e testes).
# A cada push ou pull request: instala, verifica tipos, roda os testes e gera o build do PWA.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Verificação de tipos
        run: npx tsc --noEmit
      - name: Testes automatizados
        run: npm test
      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-publica-de-exemplo
      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev
